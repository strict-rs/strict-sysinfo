[package]
name = "sysinfo"
version = { workspace = true }
authors = { workspace = true }
description = "Library to get system information such as processes, CPUs, disks, components and networks"
repository = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
exclude = ["/test-unknown"]
keywords = ["system-information", "disk", "process", "network", "cpu"]
edition = { workspace = true }

[lib]
name = "sysinfo"

[features]
default = ["component", "disk", "gpu", "network", "system", "user"]
component = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_System_Com",
    "windows/Win32_System_Ole",
    "windows/Win32_System_Rpc",
    "windows/Win32_System_Variant",
    "windows/Win32_System_Wmi",
    "dep:objc2-core-foundation",
    "objc2-core-foundation/CFArray",
    "objc2-core-foundation/CFBase",
    "objc2-core-foundation/CFDictionary",
    "objc2-core-foundation/CFNumber",
    "objc2-core-foundation/CFString",
    "dep:objc2-io-kit",
    "objc2-io-kit/hidsystem",
]
disk = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_Security", # For `windows::Win32::Storage::FileSystem::CreateFileW`.
    "windows/Win32_System_IO",
    "windows/Win32_System_Ioctl",
    "windows/Win32_System_SystemServices",
    "windows/Win32_System_WindowsProgramming",
    "dep:objc2-core-foundation",
    "objc2-core-foundation/CFArray",
    "objc2-core-foundation/CFBase",
    "objc2-core-foundation/CFDictionary",
    "objc2-core-foundation/CFError",
    "objc2-core-foundation/CFNumber",
    "objc2-core-foundation/CFString",
    "objc2-core-foundation/CFURL",
    "dep:objc2-io-kit",
]
gpu = [
    "dep:windows",
    "windows/Wdk_Graphics",
    "windows/Wdk_Graphics_Direct3D",
    "windows/Win32_Devices_DeviceAndDriverInstallation",
    "windows/Win32_Foundation",
    "windows/Win32_Graphics",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_System_Performance",
    "dep:objc2-core-foundation",
    "objc2-core-foundation/CFDictionary",
    "objc2-core-foundation/CFNumber",
    "objc2-core-foundation/CFString",
    "dep:objc2-io-kit",
]
system = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_System_Diagnostics_ToolHelp",
    "windows/Wdk_System_SystemInformation",
    "windows/Wdk_System_SystemServices",
    "windows/Wdk_System_Threading",
    "windows/Win32_Security_Authorization",
    "windows/Win32_System_Diagnostics_Debug",
    "windows/Win32_System_Kernel",
    "windows/Win32_System_Memory",
    "windows/Win32_System_Performance",
    "windows/Win32_System_Power",
    "windows/Win32_System_ProcessStatus",
    "windows/Win32_System_Registry",
    "windows/Win32_System_RemoteDesktop",
    "windows/Win32_System_SystemInformation",
    "windows/Win32_System_SystemServices",
    "windows/Win32_System_Threading",
    "windows/Win32_UI_Shell",
    "dep:ntapi",
    "dep:memchr",
    "dep:objc2-core-foundation",
    "objc2-core-foundation/CFBase",
    "objc2-core-foundation/CFData",
    "objc2-core-foundation/CFDictionary",
    "objc2-core-foundation/CFString",
    "dep:objc2-io-kit",
]
network = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_NetworkManagement_IpHelper",
    "windows/Win32_NetworkManagement_Ndis",
    "windows/Win32_Networking_WinSock",
]
user = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_NetworkManagement_NetManagement",
    "windows/Win32_Security",
    "windows/Win32_Security_Authentication_Identity",
    "windows/Win32_Security_Authorization",
    "dep:objc2-core-foundation",    
    "objc2-core-foundation/CFString",
    "dep:objc2-open-directory",
]
apple-sandbox = []
apple-app-store = ["apple-sandbox"]
c-interface = ["default"]
multithread = ["dep:rayon"]
linux-netdevs = []
linux-tmpfs = []
debug = ["libc/extra_traits"]
serde = ["dep:serde"]
# This feature is used on CI to emulate unknown/unsupported target.
unknown-ci = []

[package.metadata.docs.rs]
features = ["serde"]
# Setting this default target to prevent `freebsd` to be the default one.
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "i686-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "x86_64-unknown-freebsd",
]
cargo-args = ["-Zbuild-std"]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
memchr = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
ntapi = { workspace = true, optional = true }
windows = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "unknown", target_arch = "wasm32")))'.dependencies]
libc = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { workspace = true, optional = true, default-features = false }
objc2-io-kit = { workspace = true, optional = true, default-features = false }

# OpenDirectory framework is macOS-only; binding it on iOS triggers a linker
# error (`framework 'OpenDirectory' not found`) because the framework does not
# ship on iOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-open-directory = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
serde_json = { workspace = true }   # Used in documentation tests.
bstr = { workspace = true }
tempfile = { workspace = true }
itertools = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Diagnostics_ProcessSnapshotting"] }

[[example]]
name = "simple"
path = "examples/simple.rs"
required-features = ["default"]
doc-scrape-examples = true
[workspace]
members = ["./", "stask"]
resolver = "3"

[workspace.dependencies]
# Panic-free test vocabulary, consumed as an external git crate, tracking the
# crate's main branch. The version requirement (kept in sync with the crate's own
# version) keeps it off cargo-deny's wildcard ban; `Cargo.lock` records the
# resolved commit, refreshed by `just update`.
strict-test-support = { version = "0.1.1", git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main"}
# Generic extension capabilities and the consumer-compiled `x` registry.
template-core = { version = "0.4.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
template-stask = { version = "0.4.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
bstr = "1.13.1"
itertools = "0.15.0"
libc = "^0.2.191"
memchr = { version = "2.8"}
ntapi = { version = "0.4"}
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
] }
objc2-open-directory = { version = "0.3.2", default-features = false, features = [
    "objc2-core-foundation",
    "std",
    "CFODNode", 
    "CFODSession",
    "CFODQuery",
    "CFODRecord",
    "CFOpenDirectory",
    "CFOpenDirectoryConstants",
] }
rayon = { version = "^1.12"}
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
windows = { version = ">=0.62, <0.63"}

[workspace.package]
authors = ["Guillaume Gomez <guillaume1.gomez@gmail.com>"]
license = "MIT"
repository = "https://github.com/strict-rs/strict-sysinfo"
version = "0.40.3"
edition = "2024"
publish = false
readme = "README.md"
rust-version = "1.100"

[patch."https://github.com/strict-rs/strict-sysinfo"]
sysinfo = { path = "." }
